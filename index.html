<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Гра Шибениця — вгадай загадане слово!">
    <title>Гра Шибениця</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="game-container">
        <header class="game-header">
            <h1>Гра «Шибениця»</h1>
            <p>Вгадай загадане слово, поки не закінчилися спроби!</p>
        </header>

        <section class="game-content">

            <div class="hangman-section">
                <svg class="hangman-drawing"
                     viewBox="0 0 250 280"
                     role="img"
                     aria-label="Малюнок шибениці">

                    <line x1="20" y1="260" x2="230" y2="260" class="gallows-part"/>
                    <line x1="65" y1="260" x2="65" y2="20" class="gallows-part"/>
                    <line x1="65" y1="20" x2="170" y2="20" class="gallows-part"/>
                    <line x1="170" y1="20" x2="170" y2="55" class="gallows-part"/>

                    <circle cx="170" cy="80" r="25" class="body-part head"/>
                    <line x1="170" y1="105" x2="170" y2="175" class="body-part"/>
                    <line x1="170" y1="125" x2="135" y2="150" class="body-part"/>
                    <line x1="170" y1="125" x2="205" y2="150" class="body-part"/>
                    <line x1="170" y1="175" x2="140" y2="215" class="body-part"/>
                    <line x1="170" y1="175" x2="200" y2="215" class="body-part"/>
                </svg>
            </div>

            <div class="game-info">

                <div class="word-container">
                    <h2>Загадане слово</h2>
                    <div id="word-display" class="word-display"></div>
                </div>

                <div class="attempts-container">
                    <p>Залишилося спроб: <span id="attempts">6</span></p>
                </div>

                <div class="keyboard-container">
                    <h2>Оберіть літеру</h2>
                    <div id="keyboard" class="keyboard"></div>
                </div>

                <div id="message" class="message" aria-live="polite">
                    Удачі! Спробуй вгадати слово.
                </div>

                <button id="restart-button" class="restart-button">
                    Нова гра
                </button>

            </div>
        </section>

        <footer class="game-footer">
            <p>Індивідуальне домашнє завдання №1</p>
        </footer>

    </main>

</body>
</html>
